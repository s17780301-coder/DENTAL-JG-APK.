
name: Compilar DENTAL JG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer ZIP y compilar
        shell: bash
        run: |
          set -eu
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo "No se encontró el ZIP"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          SETTINGS="$(find source -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo "No se encontró settings.gradle"; exit 1; }
          cd "$(dirname "$SETTINGS")"
          gradle --no-daemon assembleDebug

      - name: Guardar APK generadas
        uses: actions/upload-artifact@v4
        with:
          name: DENTAL-JG-APK
          path: source/**/*.apk
          if-no-files-found: error
          
